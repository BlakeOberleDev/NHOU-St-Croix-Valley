<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>NHOU St. Croix Valley</title>
        <link rel="icon" href="src/img/NHOU_LOGO_STCROIX.webp" type="image/webp">
        <link rel="stylesheet" href="style.css">
        <script>
            let input = prompt("Please enter a Developer code (Leave empty or close this dialouge box if you are a user)")

            switch(input){
                case "scrolling_examples":
                    window.location.href = "./scrolling tests/index.html";
                    break
                case "background_video":
                    window.location.href = "./backgroundVideo.html"
                    break
            }
        </script>
    </head>

    <body>
        <header class="site-header">
            <div class="brand-row">
                <a class="brand" href="index.html" aria-label="NHOU St. Croix Valley home">
                    <img src="src/img/NHOU_LOGO_STCROIX.webp" alt="NHOU St. Croix Valley Advanced Rust Protection">
                    <span class="brand-copy" aria-hidden="true">
                        <strong>St. Croix Valley</strong>
                        <small>Advanced Rust Protection</small>
                    </span>
                </a>
                <div class="social-links" aria-label="Contact and social links">
                    <a class="social-link" href="mailto:info@nhoustcroixvalley.com" aria-label="Email NHOU St. Croix Valley" title="Email">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg>
                    </a>
                    <a class="social-link" href="tel:+17154941795" aria-label="Call NHOU St. Croix Valley" title="Call">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.1 3.5 9.7 7a1.6 1.6 0 0 1-.1 2l-1.4 1.4a14.2 14.2 0 0 0 5.4 5.4l1.4-1.4a1.6 1.6 0 0 1 2-.1l3.5 2.6a1.6 1.6 0 0 1 .5 1.9l-.8 1.8a2 2 0 0 1-2.1 1.1A19.4 19.4 0 0 1 2.3 7.9a2 2 0 0 1 1.1-2.1l1.8-.8a1.6 1.6 0 0 1 1.9.5Z"></path></svg>
                    </a>
                    <a class="social-link social-link-facebook" href="https://www.facebook.com/NHOUStCroixValley" aria-label="NHOU St. Croix Valley on Facebook" title="Facebook" target="_blank" rel="noopener noreferrer">f</a>
                </div>
            </div>
            <nav class="main-nav" aria-label="Main navigation">
                <a href="index.html" aria-current="page">Home</a>
                <a href="#services">NHOU Services</a>
                <a href="#about">About Us</a>
                <a href="faqTest.html">FAQ</a>
                <a href="mailto:info@nhoustcroixvalley.com">Contact</a>
            </nav>
        </header>

        <main>
            <section class="hero" aria-label="NHOU St. Croix Valley rust protection">
                <h1>Family Owned<br>Field Tested<br>Future Focused</h1>
            </section>
        </main>

        <div class="module module--before-after">
            <style>
                .module--before-after {
                    width: 100vw;
                    max-width: none;
                    margin-inline: calc(50% - 50vw);
                }

                @font-face {
                    font-family: "NHOU Eurostile";
                    src: url("NHOU%20Brand%20Fonts/NHOU%20Brand%20Fonts/EurostileExtended.ttf") format("truetype");
                    font-style: normal;
                    font-weight: 400;
                    font-display: swap;
                }

                .module--before-after .before-after__title {
                    margin: 0 0 20px;
                    color: #e51d35;
                    font-family: "NHOU Eurostile", Eurostile, sans-serif;
                    font-size: clamp(1.25rem, 3.5vw, 2.25rem);
                    line-height: 1.2;
                    text-align: center;
                    text-transform: uppercase;
                }

                .module--before-after .before-after__photos {
                    display: grid;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    gap: clamp(12px, 2.5vw, 28px);
                    max-width: 1000px;
                    margin-inline: auto;
                }

                .module--before-after .before-after__figure {
                    min-width: 0;
                    margin: 0;
                }

                .module--before-after .before-after__label {
                    margin: 0 0 8px;
                    color: #fff;
                    font-family: "NHOU Eurostile", Eurostile, sans-serif;
                    font-size: clamp(1rem, 2vw, 1.25rem);
                    text-align: center;
                    text-transform: uppercase;
                }

                .module--before-after .before-after__image {
                    display: block;
                    width: 100%;
                    height: auto;
                    border: 1px solid rgba(255, 255, 255, 0.25);
                }

                @media (max-width: 600px) {
                    .module--before-after .before-after__photos {
                        grid-template-columns: minmax(0, 1fr);
                    }
                }
            </style>

            <h2 class="before-after__title">AROUND HERE, WE TAKE CARE OF OUT OWN</h2>

            <div class="before-after__photos">
                <figure class="before-after__figure">
                    <figcaption class="before-after__label">Before</figcaption>
                    <img
                        class="before-after__image"
                        src="moduleCreation/before.jpeg"
                        alt="Underside of a vehicle before rust protection treatment"
                        loading="lazy"
                    >
                </figure>

                <figure class="before-after__figure">
                    <figcaption class="before-after__label">After</figcaption>
                    <img
                        class="before-after__image"
                        src="moduleCreation/after.jpeg"
                        alt="Underside of a vehicle after rust protection treatment"
                        loading="lazy"
                    >
                </figure>
            </div>
        </div>
    </body>
</html>
